<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <title>SymbolLang · Logo Playground</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/playground.css">
</head>

<body>

  <nav class="site-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-brand">SymbolLang</a>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="sample_catalog.html">Characters</a>
      <a href="sample_brand_vocab.html">Compositions</a>
      <a href="sample_packaging.html">Packaging</a>
      <a href="playground.html" class="active">Playground</a>
    </div>
    <div class="nav-right">
      <a href="downloads.html" class="nav-download">Download</a>
      <a href="https://github.com/juanantoniofm/SymboLang.git" target="_blank" rel="noopener" class="nav-github"
        aria-label="GitHub"><img class="icon-dark" src="icons/GitHub_Invertocat_White.svg" alt="GitHub"><img
          class="icon-light" src="icons/GitHub_Invertocat_Black.svg" alt="GitHub"></a>
      <button id="theme-toggle" aria-label="Toggle theme">◐</button>
    </div>
  </nav>

  <div class="pg-layout">

    <!-- ── Left: logo list ── -->
    <aside class="logo-list-panel" id="logo-list-panel">
      <div class="list-header">
        <span class="list-header-label">Logos</span>
        <button class="btn-icon" id="btn-new-logo" title="New logo">+</button>
      </div>
      <div class="logo-list" id="logo-list">
        <!-- injected by JS -->
      </div>
    </aside>

    <!-- ── Center: editor ── -->
    <main class="editor-panel" id="editor-panel">

      <div class="editor-empty" id="editor-empty">
        <div class="empty-icon sym" style="font-size:48px;font-variation-settings:'wght' 500,'MORF' 900;color:var(--color-dimmer)">H</div>
        <p>Select a logo or create a new one</p>
      </div>

      <div class="editor-content" id="editor-content">

        <div class="editor-topbar">
          <div class="editor-name-wrap">
            <div class="editor-name" id="editor-name" contenteditable="true" spellcheck="false">—</div>
            <div class="editor-formula" id="editor-formula">—</div>
          </div>
          <button class="btn-icon btn-delete-logo" id="btn-delete-logo" title="Delete logo">✕</button>
        </div>

        <div class="editor-canvas-wrap">
          <div class="card-canvas" id="editor-canvas">
            <!-- layers injected by JS -->
          </div>
        </div>

        <section class="editor-section">
          <div class="section-header">
            <span class="section-label">Layers</span>
          </div>
          <div class="layer-list" id="layer-list">
            <!-- layer rows injected by JS -->
          </div>
          <div class="layer-list-footer">
            <button class="btn-add-layer" id="btn-add-layer">+ Add Layer</button>
            <div class="char-picker" id="char-picker" hidden>
              <!-- char buttons injected by JS -->
            </div>
          </div>
        </section>

        <section class="editor-section editor-export">
          <div class="section-label">Export</div>
          <div class="export-btns">
            <button class="btn-export" id="btn-export-html" title="Copy as standalone HTML+CSS snippet">HTML + CSS</button>
            <button class="btn-export" id="btn-export-svg" title="Download as SVG with embedded font">SVG</button>
            <button class="btn-export" id="btn-export-png" title="Download as PNG (2×)">PNG</button>
          </div>
          <div class="export-feedback" id="export-feedback"></div>
        </section>

      </div>
    </main>

    <!-- ── Right: layer controls ── -->
    <aside class="ctrl-panel" id="ctrl-panel">
      <div class="panel-head">Layer Controls</div>

      <div class="panel-palette">
        <span class="pal-token" style="background:var(--color-accent)"    title="Accent"></span>
        <span class="pal-token" style="background:var(--color-accent2)"   title="Accent 2"></span>
        <span class="pal-token" style="background:var(--color-ink)"       title="Ink"></span>
        <span class="pal-token" style="background:var(--color-dim)"       title="Dim"></span>
        <span class="pal-token" style="background:var(--color-bg);border:1px solid var(--color-border)" title="BG"></span>
        <span class="pal-token" style="background:var(--color-panel);border:1px solid var(--color-border)" title="Panel"></span>
        <span class="pal-token" style="background:var(--color-slide,#ecedf2)" title="Slide"></span>
      </div>

      <div class="panel-hint" id="panel-hint">
        <div class="hint-glyph sym" style="font-variation-settings:'wght' 500,'MORF' 900;color:var(--color-dimmer)">H</div>
        <p>Select a layer to edit</p>
      </div>

      <div class="panel-controls" id="panel-controls">
        <div class="panel-preview-row">
          <div class="panel-preview-box">
            <span class="sym" id="panel-glyph">H</span>
          </div>
          <div class="panel-meta">
            <div class="panel-layer-label" id="panel-layer-label">—</div>
            <div class="panel-logo-name" id="panel-logo-name">—</div>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">Phase <code class="axis-tag">wght</code></div>
          <div class="ctrl-row">
            <input type="range" id="ctrl-wght" min="100" max="900" step="1" value="500">
            <output id="val-wght">500</output>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">Form <code class="axis-tag">MORF</code></div>
          <div class="ctrl-row">
            <input type="range" id="ctrl-morf" min="100" max="900" step="1" value="500">
            <output id="val-morf">500</output>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">Size</div>
          <div class="ctrl-row">
            <input type="range" id="ctrl-size" min="20" max="200" step="2" value="96">
            <output id="val-size">96px</output>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">Color</div>
          <div class="color-picker" id="color-picker">
            <button class="color-btn" data-color="ink"><span class="color-swatch ink-swatch"></span>Ink</button>
            <button class="color-btn" data-color="glyph"><span class="color-swatch glyph-swatch"></span>Glyph</button>
            <button class="color-btn" data-color="accent"><span class="color-swatch accent-swatch"></span>Accent</button>
            <button class="color-btn" data-color="accent2"><span class="color-swatch accent2-swatch"></span>Accent 2</button>
            <button class="color-btn" data-color="dim"><span class="color-swatch dim-swatch"></span>Dim</button>
            <button class="color-btn" data-color="dimmer"><span class="color-swatch dimmer-swatch"></span>Dimmer</button>
          </div>
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">Position</div>
          <div class="pos-row">
            <span class="pos-field">x <output id="val-x">0</output></span>
            <span class="pos-field">y <output id="val-y">0</output></span>
          </div>
        </div>

        <button class="btn-reset-layer" id="btn-reset-layer">Reset Layer</button>
      </div>
    </aside>

  </div>

  <script src="js/shared.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/playground.js"></script>
</body>

</html>
