<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @font-face {
        font-family: "SymbolLang";
        src: url("../../fonts/SymbolLang.ttf") format("truetype-variations");
      }
      .sym { font-family: "SymbolLang"; fill: #c8cdd8; }
      .sym.hot { fill: #5eead4; }
      .label { font-family: -apple-system, system-ui, sans-serif; fill: #8a8e99; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      .tick { font-family: -apple-system, system-ui, sans-serif; fill: #5a5e69; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
    </style>
  </defs>
  <rect x="0" y="1" fill="#0b0b0d" width="100%" height="100%" />
  <text class="sym" x="240" y="195" font-size="180" text-anchor="middle"
    style="font-variation-settings: 'wght' 200, 'MORF' 200">H</text>
  <text class="sym hot" x="560" y="195" font-size="180" text-anchor="middle"
    style="font-variation-settings: 'wght' 900, 'MORF' 900">H</text>
  <line x1="355" y1="160" x2="445" y2="160" stroke="#5eead4" stroke-width="2" />
  <polygon points="445,160 432,152 432,168" fill="#feeaf4" /> <!-- arrow head. should use font
  instead... -->
  <text class="tick" x="240" y="250" text-anchor="middle">same service</text>
  <text class="tick" x="560" y="250" text-anchor="middle">instant boost</text>
  <text class="label" x="400" y="285" text-anchor="middle">Identical hex · Phase &amp; Form dialed
    up · no redeploy</text>
</svg>